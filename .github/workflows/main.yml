name: weixin

on:
  workflow_dispatch:
  schedule:
    - cron: '7 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set timezone
        run: |
          sudo cp /usr/share/zoneinfo/Asia/Shanghai /etc/localtime

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build today's page
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          config = json.loads(os.environ["APP_CONFIG_JSON"])
          config["region"] = "成都"
          config["love_date"] = "2026-10-08"
          env = os.environ.copy()
          env["APP_CONFIG_JSON"] = json.dumps(config, ensure_ascii=False)
          subprocess.run(["python", "main.py", "--build-only"], check=True, env=env)
          PY

      - name: Copy Lulu fallbacks into site
        run: |
          mkdir -p _site/assets
          cp -f assets/lulu-bg.jpg _site/assets/lulu-bg.jpg
          cp -f assets/lulu-*.gif _site/assets/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send WeChat notification
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          config = json.loads(os.environ["APP_CONFIG_JSON"])
          config["region"] = "成都"
          config["love_date"] = "2026-10-08"
          config["template_id"] = "wOCo42avg71_kTdNjBZx4k4XFjw__TZXJBhXKA97PEo"
          env = os.environ.copy()
          env["APP_CONFIG_JSON"] = json.dumps(config, ensure_ascii=False)
          subprocess.run(["python", "main.py", "--notify-only"], check=True, env=env)
          PY
